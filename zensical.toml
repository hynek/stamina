[project]
strict = true
site_name = "stamina"
site_description = "Production-grade retries made easy for Python."
site_author = "Hynek Schlawack"
site_url = "https://stamina.hynek.me/"

copyright = "Copyright &copy; 2022 Hynek Schlawack"

repo_url = "https://github.com/hynek/stamina"
repo_name = "hynek/stamina"
edit_uri = "edit/main/docs/"

# Keep the .html URLs that Sphinx used, so existing links keep working.
use_directory_urls = false

extra_javascript = [
  # Trigger Read the Docs' search addon instead of Zensical's default.
  "assets/javascript/readthedocs.js",
  # Render the backoff formulas.
  # https://zensical.org/docs/authoring/math/
  "assets/javascript/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]
extra_css = [
  # Custom fonts (Inter + Berkeley Mono).
  "assets/stylesheets/fonts.css",
  # Styles for version notes in docstrings: !!! version-added "Added in 1.2.3"
  "assets/stylesheets/versions.css",
]

nav = [
  { "Overview" = "index.md" },
  "motivation.md",
  "tutorial.md",
  "testing.md",
  { "Instrumentation" = [
    "instrumentation/index.md",
    "instrumentation/prometheus.md",
    "instrumentation/structlog.md",
    "instrumentation/logging.md",
    "instrumentation/custom.md",
  ] },
  { "Reference" = ["api.md"] },
  { "Meta" = [
    "credits.md",
    { "Changelog" = "https://github.com/hynek/stamina/blob/main/CHANGELOG.md" },
    { "Security Policy" = "https://github.com/hynek/stamina/blob/main/.github/SECURITY.md" },
    { "Funding" = "https://hynek.me/say-thanks/" },
  ] },
]
watch = ["README.md", "src"]

[project.theme]
font = false
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/hynek/stamina"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/stamina/"

# API reference is generated by mkdocstrings.
# https://zensical.org/docs/setup/extensions/mkdocstrings/
[project.plugins.mkdocstrings.handlers.python]
inventories = [
    "https://docs.python.org/3/objects.inv",
    "https://pydantic.dev/docs/httpx2/objects.inv",
    "https://www.structlog.org/en/stable/objects.inv",
]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
inherited_members = true
show_source = false
show_root_members_full_path = true
heading_level = 3
# Respect the order of explicit `members` lists in api.md and the source
# order everywhere else.
group_by_category = false
members_order = "source"
# Show class signatures like `RetryingCaller(attempts=10, ...)`.
merge_init_into_class = true
# Our base classes are private.
show_bases = false
# The values of our hook objects are implementation details.
show_attribute_values = false
# api.md renders the same modules multiple times; keep the TOC tidy.
show_root_toc_entry = false


# ----------------------------------------------------------------------------
# Markdown extensions.
#
# Providing `markdown_extensions` REPLACES Zensical's built-in defaults (it does
# not merge), so we mirror Zensical's DEFAULT_MARKDOWN_EXTENSIONS here and add
# `smarty` for typographic ("smart") quotes, dashes, and ellipses, plus
# `tables`.
# Keep in sync with Zensical's defaults on upgrades.
# ----------------------------------------------------------------------------
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.smarty]
[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [{ name = "mermaid", class = "mermaid" }]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.pymdownx.tilde]

[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]
check_paths = true
