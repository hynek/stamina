---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1" # Make tools pretty.
  UV_LOCKED: "1" # Crash loudly on uv.lock vs pyproject.toml inconsistencies

permissions: {}

jobs:
  build-package:
    name: Build & verify package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: hynek/build-and-inspect-python-package@v3.0.2
        id: baipp

    outputs:
      python-versions: ${{ steps.baipp.outputs.supported_python_classifiers_json_array }}

  tests:
    name: Tests on ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: build-package
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.build-package.outputs.python-versions) }}

    steps:
      - name: Download pre-built packages
        uses: actions/download-artifact@v8.0.2
        with:
          name: Packages
          path: dist
      - name: Get tests & config from sdist; delete src.
        run: |
          tar xf dist/*.tar.gz --strip-components=1
          rm -rf src
      - uses: hynek/setup-cached-uv@v2.6.0
      - name: Prepare & run Nox
        env:
          PYTHON: ${{ matrix.python-version }}

        run: >
          uv run --only-group nox
          nox
          --parallel auto
          --python $PYTHON
          --sessions tests
          -- --installpkg dist/*.whl

      - name: Upload coverage data
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-data-${{ matrix.python-version }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: ignore

  coverage:
    name: Combine & check coverage
    runs-on: ubuntu-latest
    needs: tests
    if: always()

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: hynek/setup-cached-uv@v2.6.0

      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Combine coverage & fail if it's <100%.
        run: |
          uv run --only-group cov coverage combine
          uv run --only-group cov coverage html --skip-covered --skip-empty

          # Report and write to summary.
          uv run --only-group cov coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

          # Report again and fail if under 100%.
          uv run --only-group cov coverage report --fail-under=100

      - name: Upload HTML report if check failed.
        uses: actions/upload-artifact@v7.0.2
        with:
          name: html-report
          path: htmlcov
        if: ${{ failure() }}

  type-check-api-mypy:
    name: Type-check API on ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: build-package
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.build-package.outputs.python-versions) }}
    env:
      PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Download pre-built packages
        uses: actions/download-artifact@v8.0.2
        with:
          name: Packages
          path: dist
      - run: tar xf dist/*.tar.gz --strip-components=1
      - uses: hynek/setup-cached-uv@v2.6.0

      - name: Check using Mypy
        run: >
          uv run --only-group nox
          nox
          --python $PYTHON
          --sessions mypy_api

  typing:
    name: Run type checks
    runs-on: ubuntu-latest
    needs: build-package

    steps:
      - name: Download pre-built packages
        uses: actions/download-artifact@v8.0.2
        with:
          name: Packages
          path: dist
      - run: tar xf dist/*.tar.gz --strip-components=1
      - uses: hynek/setup-cached-uv@v2.6.0

      - name: Check package using Mypy
        run: >
          uv run --only-group nox
          nox
          --sessions mypy_pkg

      - name: Check API
        run: >
          uv run --only-group nox
          nox
          --parallel auto
          --sessions typing_api

  lint:
    name: Lint repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: hynek/setup-cached-uv@v2.6.0

      - name: Run linters
        run: uv run --only-group nox nox --parallel auto --tags lint

  install-dev:
    name: Verify locked dev env
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: hynek/setup-cached-uv@v2.6.0

      - run: uv sync

      - name: Import public modules
        run: uv run python -Ic 'import stamina; print(stamina.__version__)'

  required-checks-pass:
    name: Ensure everything required is passing for branch protection
    if: always()

    needs:
      - coverage
      - install-dev
      - lint
      - type-check-api-mypy
      - typing

    runs-on: ubuntu-latest

    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
