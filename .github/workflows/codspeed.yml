---
name: CodSpeed Benchmarks

on:
  push:
    # Baseline performance to compare against in PRs.
    branches: [main]
    paths: &codspeed_paths
      - src/**.py
      - codspeed.yml
      - .github/workflows/codspeed.yml
  pull_request:
    paths: *codspeed_paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  UV_LOCKED: "1" # Crash loudly on uv.lock vs pyproject.toml inconsistencies

permissions: {}

jobs:
  imports:
    # Runs the exec benchmarks from codspeed.yml. Walltime needs CodSpeed's
    # macro runners, which aren't available to personal accounts, so we
    # measure simulated CPU work on a regular runner instead.
    name: Measure import times
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version
      - uses: hynek/setup-cached-uv@v2.6.0

      - name: Install stamina with locked dependencies
        run: |
          uv sync --no-default-groups --no-editable --compile-bytecode
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run import benchmarks
        uses: CodSpeedHQ/action@v5.6.3
        with:
          mode: simulation
